<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Praetorian – War Rankings</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#0d0a11;--panel:#17111d;--panel2:#20172a;--purple:#4b1f5e;--purple2:#2c1338;--gold:#cda75a;--gold2:#ebcf94;--ink:#ece4d3;--mute:#9d90a8;--line:rgba(205,167,90,.28);--track:#2a1f35;
--head:"Cinzel","Trajan Pro",Georgia,serif;--body:"Cormorant Garamond",Georgia,"Times New Roman",serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(900px 500px at 85% -5%,rgba(122,58,148,.35),transparent 70%),radial-gradient(700px 400px at 0% 100%,rgba(75,31,94,.25),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.35}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;align-items:center;gap:22px;padding:22px 26px;background:linear-gradient(135deg,var(--purple),var(--purple2));border:1px solid var(--line);border-bottom:3px solid var(--gold)}
.logo{flex:none;height:84px;max-width:180px;object-fit:contain}
.ti{min-width:0}
h1{font-family:var(--head);font-weight:700;font-size:clamp(26px,5.5vw,44px);letter-spacing:.14em;margin:0;color:var(--gold2);line-height:1.1;display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px}
.tagimg{height:26px;width:auto}
.tag{font-family:var(--head);font-size:clamp(10px,2.3vw,13px);letter-spacing:.3em;color:var(--gold);margin-top:8px}
.wars{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.wars button{font:600 14px var(--head);letter-spacing:.06em;padding:7px 13px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.wars button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold2);background:var(--panel2)}
.wars button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.war{margin-top:10px;background:var(--panel);border:1px solid var(--line);padding:18px 20px 16px}
.wh{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:14px}
.wh h2{margin:0;font-family:var(--head);font-size:clamp(17px,3.2vw,24px);letter-spacing:.06em;color:var(--gold2)}
.res{padding:2px 12px;background:var(--gold);color:#1a1020;font-family:var(--head);font-weight:700;font-size:12px;letter-spacing:.2em}
.wh .m{margin-left:auto;color:var(--mute);font-size:16px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.st>div{background:var(--panel2);padding:11px 14px}
.st span{display:block;color:var(--mute);font-size:15px}
.st b{display:block;font-family:var(--head);font-size:clamp(17px,2.8vw,23px);color:var(--gold2);font-weight:700;line-height:1.25;margin-top:2px}
.cache{margin:12px 0 0;color:var(--mute);font-size:16px}
.cache em{color:var(--gold);font-style:normal;font-family:var(--head);font-size:13px;letter-spacing:.14em;margin-right:8px}
.sec{display:flex;align-items:center;gap:16px;margin:32px 0 16px;font-family:var(--head);font-size:clamp(14px,3vw,19px);letter-spacing:.3em;color:var(--gold2);text-transform:uppercase;white-space:nowrap}
.sec:before,.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.sec:after{transform:scaleX(-1)}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;max-width:880px;margin:0 auto}
.pc{display:flex;flex-direction:column;min-width:0;text-align:center;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);padding:16px 8px 0}
.pc.p1{border-color:var(--gold);box-shadow:0 0 32px rgba(205,167,90,.2);padding-top:22px}
.crown{font-size:24px;line-height:1;color:var(--gold)}
.p1 .crown{font-size:40px;color:var(--gold2)}
.pn{margin-top:8px;font-family:var(--head);font-weight:700;color:var(--gold2);font-size:clamp(12px,2.6vw,20px);overflow:hidden;text-overflow:ellipsis}
.pv{margin-top:4px;font-family:var(--head);font-size:clamp(13px,2.4vw,19px)}
.pl{margin:2px 0 14px;color:var(--mute);font-size:15px}
.plinth{margin:auto -8px 0;background:linear-gradient(180deg,var(--purple),var(--purple2));border-top:2px solid var(--gold);font-family:var(--head);font-weight:700;font-size:22px;color:var(--gold);padding:8px 0}
.p1 .plinth{padding:26px 0}.p2 .plinth{padding:16px 0}
.fin{max-width:880px;margin:0 auto}
.mot{font-family:var(--head);font-size:clamp(9px,2vw,12px);letter-spacing:.28em;color:var(--mute);margin-top:6px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 16px}
.tabs button{font:600 15px var(--head);letter-spacing:.08em;padding:8px 14px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.tabs button:hover{border-color:var(--gold)}
.tabs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1020}
.tabs button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.cat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-top:3px solid var(--purple);padding:16px 18px}
.cat h3{margin:0;font-family:var(--head);font-size:20px;letter-spacing:.08em;color:var(--gold2)}
.cat .d{color:var(--mute);font-style:italic;margin:2px 0 10px}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:30px 1fr auto;gap:3px 8px;align-items:baseline;padding:7px 0;border-top:1px solid rgba(205,167,90,.14)}
li .r{font-family:var(--head);font-weight:700;color:var(--mute);font-size:15px}
li.p1 .r,li.p2 .r,li.p3 .r{color:var(--gold)}
li.p1 .n{color:var(--gold2)}
li .n{font-weight:700;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .n i{font-style:italic;color:var(--mute);font-weight:500;font-size:16px;margin-left:8px}
li .v{font-family:var(--head);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink)}
li .b{grid-column:2/4;height:4px;background:var(--track);overflow:hidden}
li .b u{display:block;height:100%;background:linear-gradient(90deg,#7a3a94,var(--gold))}
.full .grid{grid-template-columns:1fr}
.foot{margin-top:28px;text-align:center;font-family:var(--head);letter-spacing:.3em;font-size:12px;color:var(--gold);opacity:.8}
@media(max-width:520px){.top{padding:16px;gap:14px}.logo{height:60px;max-width:110px}.wh .m{margin-left:0;width:100%}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

];

function $(id){return document.getElementById(id)}

/* Combine every war into all-time totals (members matched by name) */
function agg(){var mp={},o=[];WARS.slice().reverse().forEach(function(w){w.members.forEach(function(m){var k=m[0].toLowerCase(),r=mp[k];if(!r){r=mp[k]=[m[0],m[1],0,0,0,0,0,0,0];o.push(r)}r[1]=m[1];for(var i=2;i<8;i++)r[i]+=m[i];r[8]++})});return o}
function num(w,l){var x=w.stats.filter(function(s){return s[0]===l})[0];return x?parseFloat(x[1].replace(/,/g,"")):0}
function sum(l){return WARS.reduce(function(a,w){return a+num(w,l)},0)}

var wars=$("wars"),view="all";
function setWar(i){
var h;
if(i<0){
 M=agg();
 $("wName").textContent="All-Time Hall of Fame";$("wRes").textContent="ALL WARS";
 $("wMeta").textContent=WARS.length+" wars · "+M.length+" members honored";
 h=[["Wars fought",WARS.length],["Victories",WARS.filter(function(w){return w.result==="Victory"}).length],["Total attacks",sum("Our attacks").toLocaleString("en-US")],["Respect gained",sum("Respect gained").toLocaleString("en-US")],["Members honored",M.length],["Paid to members","$"+M.reduce(function(a,m){return a+m[7]},0).toLocaleString("en-US")]];
 $("wCache").style.display="none"}
else{
 WAR=WARS[i];M=WAR.members;
 $("wName").textContent=WAR.name;$("wRes").textContent=WAR.result.toUpperCase();$("wMeta").textContent=WAR.meta;

render()}
["★ All wars · Hall of Fame"].concat(WARS.map(function(w){return w.label})).forEach(function(t,j){var b=document.createElement("button");b.textContent=t;b.onclick=function(){setWar(j-1)};wars.appendChild(b)});

function wl(m){return m[8]?" · "+m[8]+(m[8]>1?" wars":" war"):""}
function rank(c,n){return M.filter(function(m){return m[c.i]>0}).sort(function(a,b){return b[c.i]-a[c.i]}).slice(0,n)}
function rows(c,r,off,top){return r.map(function(m,j){var n=j+off;return'<li class="'+(n<3?"p"+(n+1):"")+'"><span class="r">'+(n+1)+'</span><span class="n">'+esc(m[0])+'<i>Lvl '+m[1]+wl(m)+'</i></span><span class="v">'+c.f(m[c.i])+'</span><span class="b"><u style="width:'+(m[c.i]/top*100).toFixed(1)+'%"></u></span></li>'}).join("")}
function card(c,n){var r=rank(c,n);return'<section class="cat"><h3>'+c.t+'</h3><div class="d">'+c.d+'</div><ol>'+rows(c,r,0,r[0][c.i])+'</ol></section>'}
function hall(){
var P=C[0],r=rank(P,10);
var pod=[1,0,2].filter(function(i){return r[i]}).map(function(i){var m=r[i];return'<div class="pc p'+(i+1)+'"><div class="crown">'+(i?"✦":"♛")+'</div><div class="pn">'+esc(m[0])+'</div><div class="pv">'+P.f(m[7])+'</div><div class="pl">Lvl '+m[1]+wl(m)+'</div><div class="plinth">'+(i+1)+'</div></div>'}).join("");

var tabs=$("tabs"),out=$("out");
function render(){

out.innerHTML=h;

[{k:"all",t:"Hall of Fame"}].concat(C).forEach(function(c){var b=document.createElement("button");b.textContent=c.t;b.dataset.k=c.k;b.onclick=function(){view=c.k;render()};tabs.appendChild(b)});
