<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Praetorian – War Rankings</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#0d0a11;--panel:#17111d;--panel2:#20172a;--purple:#4b1f5e;--purple2:#2c1338;--gold:#cda75a;--gold2:#ebcf94;--ink:#ece4d3;--mute:#9d90a8;--line:rgba(205,167,90,.28);--track:#2a1f35;
--head:"Cinzel","Trajan Pro",Georgia,serif;--body:"Cormorant Garamond",Georgia,"Times New Roman",serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(900px 500px at 85% -5%,rgba(122,58,148,.35),transparent 70%),radial-gradient(700px 400px at 0% 100%,rgba(75,31,94,.25),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.35}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;align-items:center;gap:22px;padding:22px 26px;background:linear-gradient(135deg,var(--purple),var(--purple2));border:1px solid var(--line);border-bottom:3px solid var(--gold)}
.logo{flex:none;height:84px;max-width:180px;object-fit:contain}
.ti{min-width:0}
h1{font-family:var(--head);font-weight:700;font-size:clamp(26px,5.5vw,44px);letter-spacing:.14em;margin:0;color:var(--gold2);line-height:1.1;display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px}
.tagimg{height:26px;width:auto}
.tag{font-family:var(--head);font-size:clamp(10px,2.3vw,13px);letter-spacing:.3em;color:var(--gold);margin-top:8px}
.war{margin-top:18px;background:var(--panel);border:1px solid var(--line);padding:18px 20px 16px}
.wh{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:14px}
.wh h2{margin:0;font-family:var(--head);font-size:clamp(17px,3.2vw,24px);letter-spacing:.06em;color:var(--gold2)}
.res{padding:2px 12px;background:var(--gold);color:#1a1020;font-family:var(--head);font-weight:700;font-size:12px;letter-spacing:.2em}
.wh .m{margin-left:auto;color:var(--mute);font-size:16px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.st>div{background:var(--panel2);padding:11px 14px}
.st span{display:block;color:var(--mute);font-size:15px}
.st b{display:block;font-family:var(--head);font-size:clamp(17px,2.8vw,23px);color:var(--gold2);font-weight:700;line-height:1.25;margin-top:2px}
.cache{margin:12px 0 0;color:var(--mute);font-size:16px}
.cache em{color:var(--gold);font-style:normal;font-family:var(--head);font-size:13px;letter-spacing:.14em;margin-right:8px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 16px}
.tabs button{font:600 15px var(--head);letter-spacing:.08em;padding:8px 14px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.tabs button:hover{border-color:var(--gold)}
.tabs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1020}
.tabs button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.cat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-top:3px solid var(--purple);padding:16px 18px}
.cat h3{margin:0;font-family:var(--head);font-size:20px;letter-spacing:.08em;color:var(--gold2)}
.cat .d{color:var(--mute);font-style:italic;margin:2px 0 10px}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:30px 1fr auto;gap:3px 8px;align-items:baseline;padding:7px 0;border-top:1px solid rgba(205,167,90,.14)}
li .r{font-family:var(--head);font-weight:700;color:var(--mute);font-size:15px}
li.p1 .r,li.p2 .r,li.p3 .r{color:var(--gold)}
li.p1 .n{color:var(--gold2)}
li .n{font-weight:700;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .n i{font-style:italic;color:var(--mute);font-weight:500;font-size:16px;margin-left:8px}
li .v{font-family:var(--head);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink)}
li .b{grid-column:2/4;height:4px;background:var(--track);overflow:hidden}
li .b u{display:block;height:100%;background:linear-gradient(90deg,#7a3a94,var(--gold))}
.full .grid{grid-template-columns:1fr}
.foot{margin-top:28px;text-align:center;font-family:var(--head);letter-spacing:.3em;font-size:12px;color:var(--gold);opacity:.8}
@media(max-width:520px){.top{padding:16px;gap:14px}.logo{height:60px;max-width:110px}.wh .m{margin-left:0;width:100%}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
<img class="logo" id="logo" alt="Praetorian faction logo">
<div class="ti"><h1>PRAETORIAN<img class="tagimg" id="tagimg" alt=""></h1><div class="tag">DISCIPLINE · LOYALTY · FAMILY · ALWAYS</div></div>
</header>

<section class="war" aria-label="Recent war summary">
<div class="wh"><h2 id="wName"></h2><span class="res" id="wRes"></span><div class="m" id="wMeta"></div></div>
<div class="st" id="wStats"></div>
<p class="cache" id="wCache"></p>
</section>

<nav class="tabs" id="tabs" aria-label="Category view"></nav>
<main id="out"></main>
<div class="foot">SMALL WARRIORS · BIG IMPACT</div>
</div>

<script>
/* ===== UPDATE AFTER EACH WAR: edit WAR and M below, then re-upload index.html ===== */
var SITE={
  logo:"https://factionimages.torn.com/ab83dad2-461a-442e-a115-b4b5a53b8686-41160.png", /* swap in your new logo URL here */
  tag:"https://factiontags.torn.com/41160-46652.png"
};
var WAR={
  name:"Praetorian vs EPIC Warmong3rs",
  result:"Victory",
  meta:"Payout shared Sep 18, 2026 · 51 members",
  stats:[
    ["Duration","72.5 hours"],
    ["Our score","16,923"],
    ["Our attacks","2,273"],
    ["Total war attacks","3,932"],
    ["Respect gained","6,408"],
    ["Rank change","Gold I → Gold II"]
  ],
  caches:"3 Melee · 3 Armor · 1 Small Arms · 1 Medium Arms"
};
/* Member rows: [name, level, war hits, non-war hits, respect, assists, hospitalizations, payout] */
var M=[["RickGrimes",95,127,7,1337.5,19,94,65830799],["BellyFeii",50,114,28,768.1,31,14,62268572],["mawsieveDck",67,122,12,943.8,6,57,60957534],["Baymax",96,93,34,842.4,48,71,56125158],["ViaYourMum",57,87,24,543.0,22,47,47445913],["nemukud",35,92,2,673.5,6,1,45235468],["0WL",76,84,0,681.3,27,19,44451955],["Eric1965",30,88,0,545.8,0,0,41886274],["Jay",93,79,0,443.7,27,15,41401968],["Rhyzen",27,79,13,506.9,6,0,40055266],["CendanN",69,68,53,412.7,7,0,39558884],["SeveTheGreat",35,78,7,339.6,4,1,38062521],["ZZ-Top",41,74,12,522.5,2,0,37124448],["AuntieSay",70,67,1,416.4,11,18,33619354],["River-Tamworth",32,67,0,511.7,3,1,32641358],["Iceman32",70,35,127,174.0,7,9,32394206],["Mr_Fabulo",42,63,15,311.8,1,4,31630888],["by4ciksozz",22,62,0,403.3,2,0,29864156],["DaPlanet",38,61,0,292.5,0,0,28756468],["NZLrosebud",48,54,26,271.6,0,2,28537971],["MaRtY1923",49,46,30,255.4,1,1,25452245],["DemiGodZilla",32,51,0,324.3,4,0,24885921],["Avenque",25,51,1,319.6,0,0,24402572],["Skyn04",55,26,84,99.9,0,0,21999057],["Valsi",45,33,54,165.3,0,0,21894028],["aleksaiandrej1",27,41,4,270.4,1,0,20181408],["LongHong",37,39,13,225.0,1,1,20174955],["Sekerek",25,42,0,225.9,1,0,20025101],["R3gulus",50,33,37,192.1,0,0,19992988],["katanauser",16,41,0,217.7,0,0,19396616],["Jackrattler",70,37,1,393.3,2,3,18552298],["Droopyboner",69,29,0,257.4,3,18,14493683],["littlestjeff3",32,19,43,89.8,1,1,14127068],["HighlordZephrom",59,29,0,195.6,1,10,14000695],["AM31032",35,27,0,170.9,1,0,13008755],["mennas",73,23,3,89.8,0,1,11126993],["Beetal",58,20,1,106.1,1,0,9724528],["Aphoxi",48,8,48,48.3,2,4,9709077],["BroImMav",35,14,27,50.2,0,0,9702248],["Cooplix",26,13,11,53.3,0,0,7385276],["Jayb_1780",44,8,26,33.2,0,0,6794865],["ToughJew",33,9,19,47.9,0,0,6479776],["DarthSmoke",57,12,4,68.4,0,2,6159791],["Koolade221822",34,11,4,93.1,1,0,5930457],["Larryg72",78,0,46,0.0,0,0,5378943],["Jocey",40,9,8,51.9,0,0,5206741],["Cylver",50,4,3,30.3,0,4,2272663],["Jynx-Obey1220",32,1,6,2.8,0,0,1166546],["ThitherThread",53,1,0,2.5,1,0,610386],["Maggie_14",42,1,0,7.3,0,0,479541],["LegateLanius",31,1,0,3.7,0,0,467702]];
/* ===== END OF EDITABLE DATA ===== */

var C=[
{k:"pay",t:"Total Payout",d:"Greatest overall contribution",i:7,f:function(v){return"$"+v.toLocaleString("en-US")}},
{k:"war",t:"War Hits",d:"Direct blows against the enemy",i:2,f:String},
{k:"non",t:"Non-War Hits",d:"Battles beyond the faction",i:3,f:String},
{k:"res",t:"Respect",d:"Glory earned through strategy",i:4,f:function(v){return v.toLocaleString("en-US",{minimumFractionDigits:1})}},
{k:"ast",t:"Assists",d:"Backup for those beside them",i:5,f:String},
{k:"hos",t:"Hospitalizations",d:"Enemies sent to the infirmary",i:6,f:String}
];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
document.getElementById("wName").textContent=WAR.name;
document.getElementById("wRes").textContent=WAR.result.toUpperCase();
document.getElementById("wMeta").textContent=WAR.meta;
document.getElementById("wStats").innerHTML=WAR.stats.map(function(s){return'<div><span>'+esc(s[0])+'</span><b>'+esc(s[1])+'</b></div>'}).join("");
document.getElementById("wCache").innerHTML='<em>CACHES</em>'+esc(WAR.caches);
[["logo",SITE.logo],["tagimg",SITE.tag]].forEach(function(p){var e=document.getElementById(p[0]);e.onerror=function(){e.style.display="none"};e.src=p[1]});

var view="all",tabs=document.getElementById("tabs"),out=document.getElementById("out");
function card(c,n){
var r=M.filter(function(m){return m[c.i]>0}).sort(function(a,b){return b[c.i]-a[c.i]}).slice(0,n),top=r[0][c.i];
var h='<section class="cat"><h3>'+c.t+'</h3><div class="d">'+c.d+'</div><ol>';
r.forEach(function(m,j){h+='<li class="'+(j<3?"p"+(j+1):"")+'"><span class="r">'+(j+1)+'</span><span class="n">'+esc(m[0])+'<i>Lvl '+m[1]+'</i></span><span class="v">'+c.f(m[c.i])+'</span><span class="b"><u style="width:'+(m[c.i]/top*100).toFixed(1)+'%"></u></span></li>'});
return h+'</ol></section>'}
function render(){
var h;
if(view==="all"){h='<div class="grid">'+C.map(function(c){return card(c,10)}).join("")+'</div>'}
else{var c=C.filter(function(x){return x.k===view})[0];h='<div class="full"><div class="grid">'+card(c,M.length)+'</div></div>'}
out.innerHTML=h;
Array.prototype.forEach.call(tabs.children,function(b){b.setAttribute("aria-pressed",b.dataset.k===view)})}
[{k:"all",t:"Top 10 Overview"}].concat(C).forEach(function(c){
var b=document.createElement("button");b.textContent=c.t;b.dataset.k=c.k;
b.onclick=function(){view=c.k;render()};tabs.appendChild(b)});
render();
</script>
</body>
</html>
